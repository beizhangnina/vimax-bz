# Token360 configuration for the Idea2Video pipeline — high-standard defaults.
#
# Token360 is an OpenAI-compatible gateway. References (for image-to-image and
# video first/last frames) are uploaded to /v1/assets and passed back as
# asset:// URIs — see tools/token360_assets.py.
#
# Set TOKEN360_API_KEY in your .env (project root). Every section reads it
# from the environment, so no keys appear in the YAML.

chat_model:
  init_args:
    model: gpt-4o
    model_provider: token360         # auto-resolves base_url + api_key from env
  max_requests_per_minute: 500
  max_requests_per_day: 2000

image_generator:
  class_path: tools.ImageGeneratorToken360API
  init_args:
    # api_key + base_url default to TOKEN360_API_KEY / TOKEN360_BASE_URL env vars
    model: nano-banana-pro           # Google's reference-aware image gen
    # alternatives:
    #   nano-banana-2                # newer variant
    #   seedream-4.0                 # BytePlus Seedream 4.0
    #   gemini-2.5-flash-image       # original Nano Banana, fastest
    reference_field: reference_images  # asset:// URIs go here for i2i
  max_requests_per_minute: 10
  max_requests_per_day: 500

video_generator:
  class_path: tools.VideoGeneratorSeedanceToken360API
  init_args:
    t2v_model: seedance-2.0          # Dreamina Seedance 2.0 (full quality)
    ff2v_model: seedance-2.0
    flf2v_model: seedance-2.0
    # set to seedance-2.0-fast for ~2x faster renders at lower quality
  max_requests_per_minute: 5
  max_requests_per_day: 100

working_dir: .working_dir/idea2video_token360
